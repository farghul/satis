apiVersion: batch/v1
kind: Job
metadata:
  name: "satis-rebuild"
  namespace: "{{ NAMESPACE }}"
  labels:
    app.kubernetes.io/component: satis-php
    app.kubernetes.io/instance: satis
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: satis-php
    helm.sh/chart: satis-php-0.0.1
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 3
  selector: {}
  template:
    spec:
      volumes:
        - name: "satis-php"
          persistentVolumeClaim:
            claimName: "satis-php"
      containers:
        - name: rebuild
          image: "{{ PHP }}"
          args:
            - /bin/sh
            - "-c"
            - "cd {{ INSTALL }} && php bin/satis build satis.json {{ REPO }}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: "satis-php"
              mountPath: "/data/apps/satis"
              subPath: "satis"
      restartPolicy: Never
